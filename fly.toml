# Fly.io deployment (https://fly.io/docs/launch/)
# 1. fly auth login
# 2. fly launch --no-deploy --copy-config    (uses this file; pick your app name)
# 3. fly secrets set KALSHI_WEB_PASSWORD='pick-a-strong-one'
# 4. fly volumes create kalshi_state --size 1
# 5. fly deploy

app = "kalshi-agent-andrew"
primary_region = "lax"   # Los Angeles — nearest Fly region to Phoenix, AZ (phx does not exist)

[build]

[env]
  PORT = "8080"
  # KALSHI_PRIVATE_KEY_PATH carries no secret value but Fly heuristics flag
  # the name; it lives in `fly secrets` instead (set 2026-11-25)."

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # NEVER idle-stop: the permanent live agent runs on this
                                 # machine (see fly-entrypoint.sh). min=1 pins it 24/7; Fly
                                 # restarts it on crash. "stop" caused an unattended outage
                                 # 2026-11-26 01:40-01:54 (machine stopped itself, agent down).
  auto_start_machines = true
  min_machines_running = 1       # was 0 — always-on for the permanent live agent (user request 2026-11-26)

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "kalshi_state"
  destination = "/app/state"
