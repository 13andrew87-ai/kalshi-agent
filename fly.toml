# Fly.io deployment (https://fly.io/docs/launch/)
# 1. fly auth login
# 2. fly launch --no-deploy --copy-config    (uses this file; pick your app name)
# 3. fly secrets set KALSHI_WEB_PASSWORD='pick-a-strong-one'
# 4. fly volumes create kalshi_state --size 1
# 5. fly deploy

app = "kalshi-agent-andrew"
primary_region = "lax"   # Los Angeles — nearest Fly region to Phoenix, AZ (phx does not exist)

[build]

[env]
  PORT = "8080"
  # KALSHI_PRIVATE_KEY_PATH carries no secret value but Fly heuristics flag
  # the name; it lives in `fly secrets` instead (set 2026-11-25)."

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # sleep when idle (user request 2026-11-25) —
                                 # the PAPER/sim agent pauses while asleep;
                                 # live money is NOT on Fly, it lives in the sandbox
  auto_start_machines = true     # wakes on the next HTTP request
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "kalshi_state"
  destination = "/app/state"
